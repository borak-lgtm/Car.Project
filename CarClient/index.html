<!doctype html>
<html lang="sq">
<head>
    <meta charset="utf-8">
    <title>Menaxhimi i Makinave</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Menaxhimi i Makinave</h1>

    <form id="carForm">
        <input type="hidden" id="carId">

        <input id="brand" placeholder="Marka" required>
        <input id="model" placeholder="Modeli" required>
        <input id="year" type="number" placeholder="Viti" required>
        <input id="color" placeholder="Ngjyra" required>
        <input id="plateNumber" placeholder="Targa" required>
        <input id="price" type="number" placeholder="Cmimi" required>

        <button type="submit">Ruaj</button>
        <button type="button" id="cancelButton">Anulo</button>
    </form>

    <h2>Lista e makinave</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Marka</th>
                <th>Modeli</th>
                <th>Viti</th>
                <th>Ngjyra</th>
                <th>Targa</th>
                <th>Cmimi</th>
                <th>Veprime</th>
            </tr>
        </thead>
        <tbody id="carsTableBody"></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
